spring:
  application:
    name: openbench
  datasource:
    hikari:
      # The database session uses the company zone too, so dates convert alike in Java and SQL.
      connection-init-sql: SET TIME ZONE '${openbench.zone}'
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities against it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        # Off for local development over http; set SERVER_SERVLET_SESSION_COOKIE_SECURE=true behind HTTPS.
        secure: false

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

openbench:
  # The company time zone (an IANA id): windows, Price Bands, Periods, and the API's offsets.
  zone: America/New_York
